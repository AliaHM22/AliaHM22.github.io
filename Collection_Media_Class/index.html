<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Collection</title>
</head>
<body>

<h1>Movie Database </h1>

<label for="search">Search:</label>
<input type="text" id="search" placeholder="Type the movie title...">

<div id="media-container"></div>

<script>
    let jsonMovies = `
    [
        {"title":"The Stand","author":"Stephen King","price":19.99,"image":"The_Stand.jpg"},
        {"title":"Jurassic Park","author":"Michael Crichton","price":8.99,"image":"Jurassic_Park.jpeg"},
        {"title":"Killing Floor","author":"Lee Child","price":11.99,"image":"Killing_Floor.jpeg"}
    ]
    `;

    class Movie {
        #price;

        constructor(title, author, price, image) {
            this.title = title;
            this.author = author;
            this.image = image;
            this.price = price;
        }

        get price() {
            return this.#price;
        }

        set price(p) {
            this.#price = p < 0 ? 0 : p;
        }

        toString() {
            return this.title + " by " + this.author + " ($" + this.price + ")";
        }

        buildElement() {
            let box = document.createElement("div");
            box.style.border = "1px solid black";
            box.style.width = "200px";
            box.style.margin = "10px";
            box.style.padding = "10px";
            box.style.textAlign = "center";

            let img = document.createElement("img");
            img.src = this.image;
            img.style.width = "100%";
            box.appendChild(img);

            let titleEl = document.createElement("p");
            titleEl.textContent = this.title;
            box.appendChild(titleEl);

            let authorEl = document.createElement("p");
            authorEl.textContent = "Author: " + this.author;
            box.appendChild(authorEl);

            let priceEl = document.createElement("p");
            priceEl.textContent = "Price: $" + this.price;
            box.appendChild(priceEl);

            return box;
        }
    }

    let movieData = JSON.parse(jsonMovies);
    let movies = [];
    for (let i = 0; i < movieData.length; i++) {
        let m = new Movie(
            movieData[i].title,
            movieData[i].author,
            movieData[i].price,
            movieData[i].image
        );
        movies.push(m);
    }

    let container = document.getElementById("media-container");

    function displayMovies(list) {
        container.innerHTML = ""; 
        for (let i = 0; i < list.length; i++) {
            container.appendChild(list[i].buildElement());
        }
    }

    displayMovies(movies);

    document.getElementById("search").addEventListener("input", function() {
        let query = this.value.toLowerCase();
        let filtered = movies.filter(movie => movie.title.toLowerCase().includes(query));
        displayMovies(filtered);
    });
</script>

</body>
</html>
